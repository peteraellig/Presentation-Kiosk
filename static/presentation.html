<!DOCTYPE html>
  <!-- Kiosk3 3.18 · © Peter Aellig -->
  <!-- presentation.html -->
  <!-- change standard display content at the end of this file! -->
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Kiosk3 – Presentation Screen</title>
  <script src="static/socket.io.min.js"></script>
  <style>

    body { 
      background: #222; 
      margin: 0; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh;
      cursor: none;
    }
    
    /* picture and video fill the screen (smaller sources, e.g. 720p, are scaled up, aspect ratio kept) */
    #stage img, #stage video {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      cursor: none;
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <button id="enableSound" hidden style="position:fixed;bottom:16px;left:16px;cursor:pointer;padding:8px 12px">Ton aktivieren</button>
    <div id="serverIpBadge" style="position: fixed; right: 16px; top: 16px; background: rgba(0,0,0,0.65); color: #fff; font: 14px/1.4 sans-serif; padding: 8px 12px; border-radius: 8px; z-index: 9999; display:none; white-space: pre-line;">
    </div>
  <script src="/static/player.js"></script>
  <script>
    // === Einstellungen ===

    // wieviele Minuten soll die IP ab Start von app.py zu sehen sein?
    const IP_BADGE_MINUTES = 1;   // <— HIER anpassen

    // Minuten -> Millisekunden
    const msFromMinutes = (m) => m * 60 * 1000;

    // started_at kann in s oder ms kommen -> normalisieren
    const normalizeStartedAtMs = (started_at) => {
      if (!started_at) return 0;
      return started_at > 1e12 ? started_at : started_at * 1000;
    };

    // mm:ss formatieren
    const formatMMSS = (ms) => {
      const totalSec = Math.max(0, Math.floor(ms / 1000));
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    };

    // Timer-Handles, damit wir bei neuen Events sauber aufräumen
    let ipHideTimeout = null;
    let ipCountdownInterval = null;


    // zeigt ip an
    // zeigt IP + Countdown an (mm:ss), räumt alte Timer sauber auf

    
socket.on('server_info', (data) => {
  // the OMT output instance (?omt=1) must never show the IP badge
  if (new URLSearchParams(location.search).has('omt')) return;
  // laufende Timer stoppen
  if (ipHideTimeout) { clearTimeout(ipHideTimeout); ipHideTimeout = null; }
  if (ipCountdownInterval) { clearInterval(ipCountdownInterval); ipCountdownInterval = null; }

  const appStartedAtMs = normalizeStartedAtMs(data.started_at); // vom Server
  const nowMs = Date.now();
  const totalVisibleMs = msFromMinutes(IP_BADGE_MINUTES);

  const elapsedSinceStart = nowMs - appStartedAtMs;
  let remainingMs = Math.max(0, totalVisibleMs - elapsedSinceStart);

  if (remainingMs > 0 && data.ip) {
    // IP + verbleibende Zeit (zweite Zeile)
    ipBadge.textContent = `Kiosk3 3.18 · © Peter Aellig\nServer: ${data.ip}:${data.port}\nIP blendet aus in: ${formatMMSS(remainingMs)}`;
    ipBadge.style.display = 'block';

    // Countdown aktualisieren
    ipCountdownInterval = setInterval(() => {
      remainingMs -= 250;
      if (remainingMs <= 0) {
        clearInterval(ipCountdownInterval);
        ipCountdownInterval = null;
        ipBadge.style.display = 'none';
        return;
      }
      ipBadge.textContent = `Kiosk3 3.18 · © Peter Aellig\nServer-IP: ${data.ip}:${data.port}\nIP blendet aus in: ${formatMMSS(remainingMs)}`;
    }, 250);

    // Failsafe: nach Ablauf ausblenden
    ipHideTimeout = setTimeout(() => {
      if (ipCountdownInterval) clearInterval(ipCountdownInterval);
      ipCountdownInterval = null;
      ipBadge.style.display = 'none';
    }, remainingMs + 50);
  } else {
    ipBadge.style.display = 'none';
  }
});
    </script>
</body>
</html>
